            - img [ref=e90]
          - paragraph [ref=e91]: LODStudios is a 3D development studio specialized in creating high-quality assets for various games and projects. Our main focus is GTAV, where we place great emphasis on optimized, powerful and performant products. Through efficient development and high quality standards, we create content that is both visually compelling and resource-friendly.
        - generic [ref=e92]:
          - button "Where do I receive my purchase?" [ref=e93]:
            - generic [ref=e94]:
              - img [ref=e96]
              - generic [ref=e101]: Where do I receive my purchase?
            - img [ref=e103]
          - paragraph [ref=e104]: All purchases are delivered instantly through Tebex. Once your payment is completed, the product is automatically assigned to your Cfx.re Portal account and is immediately available for download or transfer. You will also receive access to your license key and product details right away.
        - generic [ref=e105]:
          - button "Can I use the assets on multiple servers?" [ref=e106]:
            - generic [ref=e107]:
              - img [ref=e109]
              - generic [ref=e112]: Can I use the assets on multiple servers?
            - img [ref=e114]
          - paragraph [ref=e115]: Each license can be used across multiple FiveM servers, provided they are running under the same Cfx.re license key. The Cfx.re key configured in your server.cfg is used for license verification. If a LODStudios asset is linked to a specific Cfx.re key, any server using that same key will have access to the asset. This allows you to run the product on multiple servers without requiring additional licenses, as long as they share the same registered Cfx.re key.
